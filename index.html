<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Administration – EDEN AUTOMOBILES</title>
<style>
:root{--tb:#2F8FB5;--sd:#27313B;--sd2:#1D252D;--sdt:#C9D3DB;--bg:#F2F5F7;--sf:#fff;--ink:#222B33;--mu:#6B7782;--ln:#DDE3E8;--bl:#2F8FB5;--or:#F5A100;--gr:#1E9E57;--rd:#D4202A;--wa:#B3322A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Segoe UI",sans-serif}
h1,h2,h3{margin:0;line-height:1.2}
button,input,select,textarea{font:inherit}
.top{position:sticky;top:0;z-index:20;height:52px;background:var(--tb);color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px}
.top .lg{font-weight:800;font-size:19px;letter-spacing:.2px;min-width:190px;white-space:nowrap}
.top .lg i{font-style:normal;color:#FFD9D6}
.burger{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;padding:6px 10px}
.top .al{flex:1;font-size:14px}.top .al button{background:none;border:0;color:#fff;cursor:pointer;text-decoration:underline}
.top .us{font-size:14px;white-space:nowrap}
.top .out{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:6px;padding:7px 12px;cursor:pointer}
.lay{display:flex;min-height:calc(100vh - 52px)}
aside{width:224px;flex:0 0 224px;background:var(--sd);color:var(--sdt)}
aside .g>button,aside .sub button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;color:inherit;text-align:left;padding:12px 16px;cursor:pointer;font-size:15px}
aside .g>button:hover,aside .sub button:hover{background:var(--sd2)}
aside .on{background:var(--sd2)!important;color:#fff;box-shadow:inset 3px 0 0 var(--bl)}
aside .sub{background:#212A33}aside .sub button{padding:9px 16px 9px 44px;font-size:14px}
aside .nb{margin-left:auto;background:var(--or);color:#1b1608;border-radius:99px;padding:0 8px;font-size:12px;font-weight:700}
aside .ic{width:20px;text-align:center}
main{flex:1;min-width:0;padding:18px 18px 70px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar h2{font-size:21px}
.tools{background:var(--sf);border:1px solid var(--bl);border-radius:4px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools .sp{margin-left:auto}
.btn{border:0;cursor:pointer;border-radius:4px;padding:8px 14px;font-weight:600;background:var(--bl);color:#fff;white-space:nowrap}
.btn.gn{background:var(--gr)}.btn.or{background:var(--or);color:#fff}.btn.gy{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ln)}.btn.rd{background:#fff;color:var(--wa);box-shadow:inset 0 0 0 1px var(--ln)}
.btn.sm{padding:5px 10px;font-size:13px}.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:4px}
.tbw{overflow-x:auto;border-top:3px solid var(--bl);background:var(--sf);border-radius:3px}
table{border-collapse:collapse;width:100%;min-width:760px}
th{color:var(--bl);font-size:13px;text-align:left;padding:12px 10px;white-space:nowrap}
td{padding:12px 10px;border-top:1px solid var(--ln);vertical-align:middle}
tr:hover td{background:#FAFCFD}
.th{width:64px;height:48px;border-radius:5px;background:var(--bg);display:grid;place-items:center;overflow:hidden;color:var(--mu);font-size:11px}.th img{width:100%;height:100%;object-fit:cover}
.np{display:inline-block;background:#F0F3F5;border:1px solid var(--ln);border-radius:4px;padding:5px 9px;font-weight:600;white-space:nowrap}
.bd{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.b-gr{background:#E6EAED;color:#4a5560}.b-ok{background:#DDF3E6;color:#14733F}.b-or{background:#FDEBC8;color:#8A5A00}.b-bl{background:#D9ECF5;color:#1D6E8F}.b-gy{background:#EEE;color:#666}.b-rd{background:#FBE0DE;color:#9A2B24}
.mu{color:var(--mu);font-size:13.5px}
.pub{font-size:12px;color:var(--gr);font-weight:700}
.acts{display:flex;gap:6px;flex-wrap:wrap}
select,input:not([type=checkbox]),textarea{width:100%;padding:8px 10px;border:1px solid var(--ln);border-radius:4px;background:#fff;color:var(--ink)}
select.in{width:auto;padding:5px 8px}
input[type=checkbox]{width:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--bl);border-radius:4px;padding:14px;cursor:pointer;text-align:left}
.stat b{display:block;font-size:28px;line-height:1.1}.stat span{color:var(--mu);font-size:13.5px}
.empty{border:2px dashed var(--ln);border-radius:6px;padding:28px;text-align:center;color:var(--mu);background:var(--sf)}
.note{background:#FFF8E6;border-left:4px solid var(--or);padding:10px 14px;border-radius:4px;margin:12px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:4px 12px;cursor:pointer}.chip.on{border-color:var(--bl);color:var(--bl);font-weight:700}
.rq{background:var(--sf);border:1px solid var(--ln);border-radius:4px;padding:14px;margin-bottom:12px}
.rq dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:10px 0}.rq dt{color:var(--mu)}.rq dd{margin:0;overflow-wrap:anywhere}
.chk{display:flex;gap:8px;align-items:center;font-weight:600}
dialog{border:0;border-radius:8px;width:min(780px,calc(100% - 16px));max-height:calc(100% - 16px);background:var(--sf);color:var(--ink);padding:0}
dialog::backdrop{background:rgba(10,14,16,.55)}
.dh{padding:16px 20px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--sf);z-index:2}
.db{padding:6px 20px 20px}
.db h3{font-size:15px;color:var(--bl);margin:20px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--ln)}
.db label{display:block;font-weight:600;font-size:13.5px;margin:10px 0 4px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.phs{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0}.pt{position:relative;width:70px;height:54px}.pt img{width:100%;height:100%;object-fit:cover;border-radius:5px}
.pt button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:#fff;cursor:pointer}
.login{max-width:380px;margin:12vh auto;padding:0 16px}.login label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.sc{display:none}
@media(max-width:860px){aside{position:fixed;top:52px;bottom:0;left:0;z-index:30;transform:translateX(-100%);transition:transform .2s;overflow-y:auto}aside.open{transform:none}.sc.open{display:block;position:fixed;inset:52px 0 0;background:rgba(0,0,0,.4);z-index:25}.top .lg{min-width:0;flex:1}.top .us,.top .al,.top .out[data-refresh]{display:none}.r2,.r3{grid-template-columns:1fr}main{padding:14px 10px 70px}}
@media print{.top,aside,.tools,.noprint,.acts{display:none!important}main{padding:0}table{min-width:0;font-size:11px}.tbw{border:0}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n==null||n===""?"":Number(n).toLocaleString("fr-FR");
const eur=n=>n==null||n===""?"":Number(n).toLocaleString("fr-FR",{minimumFractionDigits:0,maximumFractionDigits:2})+" € TTC";
const dFr=t=>t?new Date(t.length===10?t+"T12:00:00":t).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}):"";
const dtFr=t=>t?new Date(t).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}):"";
const today=()=>new Date().toISOString().slice(0,10);
const ST={preparation:["En préparation","b-gr"],en_vente:["En vente","b-ok"],reserve:["Réservé","b-or"],vendu:["Vendu","b-bl"],sorti:["Sorti du parc","b-gy"]};
const A2={en_vente:"disponible",reserve:"reserve",vendu:"vendu",sorti:"vendu"};
const FROM_A={disponible:"en_vente",reserve:"reserve",vendu:"vendu"};
const PAY=["Virement","Chèque","Espèces","Carte bancaire","Financement","Dépôt-vente","Autre"];
const ENTREE={achat:"Achat",depot_vente:"Dépôt-vente",reprise:"Reprise"};
const DT={recherche:"Recherches personnalisées",estimation:"Estimations",reservation:"Réservations",rappel:"Demandes de rappel"};
const DS={nouvelle:"Nouvelle",rappelee:"Rappelée",traitee:"Traitée"};
const nomV=v=>[v.marque,v.modele,v.version].filter(Boolean).join(" ")||"Véhicule sans nom";
const nomC=c=>!c?"":c.societe?c.societe:[c.prenom,c.nom].filter(Boolean).join(" ");
let sb,S={clients:[],parc:[],ann:[],dem:[]},view="dash",flt="all",qv="",pend=null,timer=null,ph=[],editing=null,navOpen=false;
const cl=id=>S.clients.find(c=>c.id===id);
const opt=(list,v,blank)=>(blank?`<option value="">${blank}</option>`:"")+list.map(x=>{const [k,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(k)}" ${String(k)===String(v??"")?"selected":""}>${esc(l)}</option>`}).join("");

/* ---------- connexion ---------- */
async function init(){
 try{const c=await (await fetch("/api/config")).json();if(!c.url||!c.anonKey)throw 0;sb=supabase.createClient(c.url,c.anonKey)}
 catch(e){$("app").innerHTML=`<div class="login"><p class="note">Configuration manquante : vérifiez SUPABASE_URL et SUPABASE_ANON_KEY dans Cloudflare.</p></div>`;return}
 const {data}=await sb.auth.getSession();data.session?start():login();
}
function login(msg){
 clearInterval(timer);
 $("app").innerHTML=`<form id="lf" class="login"><h1>Administration</h1><p class="mu">EDEN AUTOMOBILES</p>${msg?`<p class="note">${esc(msg)}</p>`:""}<label>Email<input id="em" type="email" autocomplete="username" required></label><label>Mot de passe<input id="pw" type="password" autocomplete="current-password" required></label><p><button class="btn">Se connecter</button></p></form>`;
 $("lf").onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});error?login("Identifiants incorrects."):start()};
}
async function start(){await load(true);timer=setInterval(()=>load(false),60000)}
async function load(force){
 const r=await Promise.all([sb.from("clients").select("*").order("nom"),sb.from("parc").select("*").order("numero_police",{ascending:false}),sb.from("annonces").select("*").order("created_at"),sb.from("demandes").select("*").order("created_at",{ascending:false})]);
 if(r.some(x=>x.error)){const m=(r.find(x=>x.error).error.message||"");login(/relation|does not exist|schema cache/i.test(m)?"Tables manquantes : exécutez le script eden-admin-parc.sql dans Supabase.":"Session expirée, reconnectez-vous.");return}
 [S.clients,S.parc,S.ann,S.dem]=r.map(x=>x.data);
 if(force||(!document.querySelector("dialog[open]")&&!["TEXTAREA","INPUT"].includes(document.activeElement.tagName)))render();
}

/* ---------- structure ---------- */
const newDem=t=>S.dem.filter(d=>(!t||d.type===t)&&d.statut==="nouvelle").length;
const cnt=s=>S.parc.filter(v=>v.statut===s).length;
function render(){
 const sel=(k)=>view===k?"on":"";
 const nd=newDem();
 const vehSub=[["veh:all","Tous les véhicules",S.parc.length],["veh:preparation","En préparation",cnt("preparation")],["veh:en_vente","En vente",cnt("en_vente")],["veh:reserve","Réservés",cnt("reserve")],["veh:vendu","Vendus",cnt("vendu")],["veh:sorti","Sortis du parc",cnt("sorti")]];
 const demSub=Object.keys(DT).map(k=>["dem:"+k,DT[k],newDem(k)]);
 const grp=(k,ic,l,sub)=>`<div class="g"><button class="${view.startsWith(k)?"on":""}" data-go="${sub[0][0]}"><span class="ic">${ic}</span>${l}</button>${view.startsWith(k)?`<div class="sub">${sub.map(([v,t,n])=>`<button class="${view===v?"on":""}" data-go="${v}">${t}${n?`<span class="nb">${n}</span>`:""}</button>`).join("")}</div>`:""}</div>`;
 $("app").innerHTML=`<div class="top"><button class="burger" data-nav aria-label="Menu">☰</button><span class="lg">EDEN<i>.</i> Admin</span>
 <span class="al">${nd?`<button data-go="dem:${Object.keys(DT).find(k=>newDem(k))}">Vous avez ${nd} demande${nd>1?"s":""} à traiter</button>`:"Aucune demande à traiter"}</span>
 <span class="us">accueil.edenautomobiles@gmail.com</span><button class="out" data-refresh>Actualiser</button><button class="out" data-out>Déconnexion</button></div>
 <div class="lay"><aside class="${navOpen?"open":""}" id="sd"><div class="g"><button class="${sel("dash")}" data-go="dash"><span class="ic">🏠</span>Tableau de bord</button></div>
 ${grp("veh","🚗","Véhicules",vehSub)}
 <div class="g"><button class="${sel("police")}" data-go="police"><span class="ic">🏛</span>Livre de police</button></div>
 <div class="g"><button class="${sel("clients")}" data-go="clients"><span class="ic">👥</span>Clients</button></div>
 ${grp("dem","🔔","Demandes du site",demSub)}
 <div class="g"><button data-site><span class="ic">🌐</span>Voir le site</button></div></aside><div class="sc ${navOpen?"open":""}" data-nav></div>
 <main id="mn">${page()}</main></div>`;
}
function page(){
 if(view==="dash")return pDash();
 if(view.startsWith("veh:"))return pVeh(view.slice(4));
 if(view==="police")return pPolice();
 if(view==="clients")return pClients();
 if(view.startsWith("dem:"))return pDem(view.slice(4));
 return "";
}

/* ---------- tableau de bord ---------- */
function pDash(){
 const mois=today().slice(0,7),vm=S.parc.filter(v=>v.statut==="vendu"&&(v.date_sortie||"").startsWith(mois));
 const marge=vm.reduce((s,v)=>s+((+v.prix_vente||0)-(+v.prix_achat||0)),0);
 const stock=S.parc.filter(v=>["en_vente","reserve"].includes(v.statut)).reduce((s,v)=>s+(v.prix_affiche||0),0);
 const st=(n,l,go)=>`<button class="stat" data-go="${go}"><b>${n}</b><span>${l}</span></button>`;
 const last=S.dem.filter(d=>d.statut==="nouvelle").slice(0,6);
 const orph=S.ann.filter(a=>!S.parc.some(v=>v.annonce_id===a.id));
 return `<div class="bar"><h2>Tableau de bord</h2></div>
 ${orph.length?`<div class="note">${orph.length} annonce${orph.length>1?"s":""} du site ne figure${orph.length>1?"nt":""} pas encore dans votre parc. <button class="btn or sm" data-import>Les importer dans le parc</button></div>`:""}
 <div class="stats">${st(cnt("en_vente"),"Véhicules en vente","veh:en_vente")}${st(cnt("reserve"),"Réservés","veh:reserve")}${st(cnt("preparation"),"En préparation","veh:preparation")}${st(vm.length,"Vendus ce mois-ci","veh:vendu")}${st(newDem(),"Demandes à traiter",newDem()?"dem:"+Object.keys(DT).find(k=>newDem(k)):"dem:recherche")}</div>
 <div class="stats"><div class="stat" style="cursor:default"><b>${fmt(stock)} €</b><span>Valeur du stock affiché (en vente + réservés)</span></div><div class="stat" style="cursor:default"><b>${fmt(Math.round(marge))} €</b><span>Marge brute des ventes du mois (prix de vente − prix d’achat, hors frais)</span></div></div>
 <h3 style="margin:6px 0 10px">Dernières demandes à traiter</h3>
 ${last.length?`<div class="tbw"><table><tbody>${last.map(d=>`<tr><td>${dtFr(d.created_at)}</td><td><span class="bd b-bl">${esc(DT[d.type]||d.type)}</span></td><td><b>${esc(d.nom)}</b></td><td>${esc(d.telephone)}</td><td>${esc(d.vehicule||d.marque_modele||"")}</td><td><button class="btn sm" data-go="dem:${d.type}">Ouvrir</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Aucune demande en attente.</div>`}`;
}

/* ---------- véhicules ---------- */
function vehRows(f){
 let l=f==="all"?S.parc:S.parc.filter(v=>v.statut===f);
 const t=qv.trim().toLowerCase();
 if(t)l=l.filter(v=>[nomV(v),v.immatriculation,v.vin,v.numero_police].join(" ").toLowerCase().includes(t));
 return l;
}
function pVeh(f){
 const l=vehRows(f),title=f==="all"?"Tous les véhicules":ST[f][0];
 const rows=l.map(v=>{const p=(v.photos||[])[0];return `<tr><td><span class="np">${v.numero_police}</span></td><td><div class="th">${p?`<img src="${esc(p)}" alt="">`:"Photo"}</div></td>
 <td><b>${esc(nomV(v))}</b>${v.annonce_id?`<br><span class="pub">● Publié sur le site</span>`:""}</td><td>${esc(v.immatriculation||"")}</td>
 <td>${[v.annee,v.km!=null?fmt(v.km)+" km":"",v.energie,v.boite].filter(Boolean).map(esc).join(" · ")}</td><td><b>${v.prix_affiche!=null?fmt(v.prix_affiche)+" €":"–"}</b></td>
 <td><select class="in" data-vst="${v.id}" aria-label="Statut">${opt(Object.entries(ST).map(([k,x])=>[k,x[0]]),v.statut)}</select></td>
 <td><div class="acts"><button class="btn or sm" data-vedit="${v.id}">Modifier</button>${v.annonce_id?`<button class="btn gy sm" data-unpub="${v.id}">Retirer du site</button>`:`<button class="btn gn sm" data-pub="${v.id}">Ajouter à mes annonces</button>`}${["vendu","sorti"].includes(v.statut)?"":`<button class="btn gy sm" data-sortie="${v.id}">Sortie</button>`}</div></td></tr>`}).join("");
 return `<div class="bar"><h2>${title} <span class="mu">(${l.length})</span></h2></div>
 <div class="tools"><button class="btn gn" data-vnew>＋ Ajouter un véhicule</button><div class="sp"><input id="qv" type="search" placeholder="Rechercher (modèle, plaque, n°…)" value="${esc(qv)}" style="min-width:230px"></div></div>
 ${l.length?`<div class="tbw"><table><thead><tr><th>N°&nbsp;police</th><th></th><th>Véhicule</th><th>Immat.</th><th>Détails</th><th>Prix affiché</th><th>Statut</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">Aucun véhicule ici.${f==="all"?" Ajoutez-en un avec « Ajouter un véhicule ».":""}</div>`}`;
}
const cs=(id,v)=>`<select id="${id}">${opt(S.clients.map(c=>[c.id,nomC(c)+(c.ville?" · "+c.ville:"")]),v,"— Aucun —")}<option value="__new">＋ Nouveau client…</option></select>`;
const nv=id=>{const v=$(id).value.trim();return v===""?null:+v};
const tv=id=>{const v=$(id).value.trim();return v===""?null:v};
function vehForm(v,pre){
 const a=v||pre||{};editing=v?v.id:null;ph=(a.photos||[]).slice();
 $("dlg").innerHTML=`<div class="dh"><h2>${v?`Véhicule n° ${v.numero_police}`:"Nouveau véhicule"}</h2><button class="btn gy sm" type="button" data-cancel>Fermer</button></div><form class="db" id="fv">
 <h3>Identification</h3>
 <div class="r3"><div><label>Marque</label><input id="v_marque" value="${esc(a.marque)}"></div><div><label>Modèle</label><input id="v_modele" value="${esc(a.modele)}"></div><div><label>Version</label><input id="v_version" value="${esc(a.version)}" placeholder="1.5 BlueHDi 102 ch"></div></div>
 <div class="r3"><div><label>Immatriculation</label><input id="v_immat" value="${esc(a.immatriculation)}" placeholder="AB-123-CD"></div><div><label>N° de série (VIN)</label><input id="v_vin" value="${esc(a.vin)}"></div><div><label>Couleur</label><input id="v_couleur" value="${esc(a.couleur)}"></div></div>
 <div class="r3"><div><label>Année</label><input id="v_annee" type="number" min="1950" max="2100" value="${esc(a.annee)}"></div><div><label>Kilométrage</label><input id="v_km" type="number" min="0" value="${esc(a.km)}"></div>
 <div><label>Énergie</label><select id="v_energie">${opt(["Essence","Diesel","Hybride","Électrique","GPL"],a.energie,"—")}</select></div></div>
 <div class="r3"><div><label>Boîte</label><select id="v_boite">${opt(["Manuelle","Automatique"],a.boite,"—")}</select></div></div>
 <h3>Entrée au parc (achat)</h3>
 <div class="r3"><div><label>Date d’entrée</label><input id="v_dentree" type="date" value="${esc(a.date_entree||today())}"></div><div><label>Type d’entrée</label><select id="v_tentree">${opt(Object.entries(ENTREE),a.type_entree||"achat")}</select></div><div><label>Statut</label><select id="v_statut">${opt(Object.entries(ST).map(([k,x])=>[k,x[0]]),a.statut||"preparation")}</select></div></div>
 <div class="r3"><div><label>Vendeur (client)</label>${cs("v_vendeur",a.vendeur_id)}</div><div><label>Prix d’achat (€ TTC)</label><input id="v_pachat" type="number" step="0.01" min="0" value="${esc(a.prix_achat)}"></div><div><label>Moyen de paiement</label><select id="v_mpa">${opt(PAY,a.moyen_paiement_achat,"—")}</select></div></div>
 <h3>Vente et sortie</h3>

async function shrink(f){
 const i=await createImageBitmap(f),s=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement("canvas");
 c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(r,"image/jpeg",.82));
}
const annoncePayload=v=>({titre:nomV(v),prix:v.prix_affiche||0,annee:v.annee||null,km:v.km??null,energie:v.energie||null,boite:v.boite||null,equipements:v.equipements||[],description:v.description||null,photos:v.photos||[],statut:A2[v.statut]||"disponible"});
/* Aligne l'annonce du site sur la fiche du parc (créée, mise à jour ou retirée). */
async function syncAnnonce(v,wantPub){
 if(v.statut==="preparation"||wantPub===false){
  if(v.annonce_id){const r=await sb.from("annonces").delete().eq("id",v.annonce_id);if(r.error)throw r.error;const u=await sb.from("parc").update({annonce_id:null}).eq("id",v.id);if(u.error)throw u.error}
  return;
 }
 if(v.annonce_id){const r=await sb.from("annonces").update(annoncePayload(v)).eq("id",v.annonce_id);if(r.error)throw r.error;return}
 if(wantPub){
  if(v.prix_affiche==null)throw new Error("Indiquez le prix affiché pour publier ce véhicule.");
  const r=await sb.from("annonces").insert(annoncePayload(v)).select("id").single();if(r.error)throw r.error;
  const u=await sb.from("parc").update({annonce_id:r.data.id}).eq("id",v.id);if(u.error)throw u.error;
 }
}
async function saveVeh(e){
 e.preventDefault();$("fs").disabled=true;$("fm").textContent="Enregistrement…";
 try{
  const files=[...$("v_files").files].slice(0,Math.max(0,20-ph.length));
  for(const f of files){const b=await shrink(f),p=crypto.randomUUID()+".jpg";
   const u=await sb.storage.from("photos").upload(p,b,{contentType:"image/jpeg"});if(u.error)throw u.error;
   ph.push(sb.storage.from("photos").getPublicUrl(p).data.publicUrl)}
  const o={marque:tv("v_marque"),modele:tv("v_modele"),version:tv("v_version"),immatriculation:tv("v_immat"),vin:tv("v_vin"),couleur:tv("v_couleur"),annee:nv("v_annee"),km:nv("v_km"),energie:tv("v_energie"),boite:tv("v_boite"),
   date_entree:$("v_dentree").value||today(),type_entree:$("v_tentree").value,statut:$("v_statut").value,vendeur_id:tv("v_vendeur"),prix_achat:nv("v_pachat"),moyen_paiement_achat:tv("v_mpa"),
   prix_affiche:nv("v_paff"),acheteur_id:tv("v_acheteur"),prix_vente:nv("v_pvente"),moyen_paiement_vente:tv("v_mpv"),date_sortie:tv("v_dsortie"),
   description:tv("v_desc"),equipements:$("v_equip").value.split("\n").map(s=>s.trim()).filter(Boolean),photos:ph,note:tv("v_note")};
  if(!o.marque&&!o.modele)throw new Error("Indiquez au moins la marque ou le modèle.");
  if(["vendu","sorti"].includes(o.statut)&&!o.date_sortie)o.date_sortie=today();
  const r=editing?await sb.from("parc").update(o).eq("id",editing).select("*").single():await sb.from("parc").insert(o).select("*").single();
  if(r.error)throw r.error;
  editing=r.data.id;
  const wantPub=$("v_pub").checked;
  if(wantPub&&o.statut==="preparation")throw new Error("Véhicule enregistré, mais il ne peut pas être publié tant qu’il est « En préparation ». Passez-le « En vente ».");
  await syncAnnonce(r.data,wantPub);

 }catch(err){$("fm").textContent="Échec : "+(err.message||"erreur");$("fs").disabled=false}
}

function csv(){

 const lines=[...S.parc].sort((a,b)=>a.numero_police-b.numero_police).map(v=>{const s=cl(v.vendeur_id),a=cl(v.acheteur_id);return [v.numero_police,v.date_entree,ENTREE[v.type_entree],v.marque,v.modele,v.version,v.immatriculation,v.vin,nomC(s),adr(s),s&&s.piece_identite,v.prix_achat,v.moyen_paiement_achat,nomC(a),adr(a),v.prix_vente,v.moyen_paiement_vente,v.date_sortie,ST[v.statut][0]].map(q).join(";")});
 const b=new Blob(["﻿"+[head.map(q).join(";"),...lines].join("\r\n")],{type:"text/csv;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="livre-de-police-"+today()+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

 else if(d.vedit)vehForm(S.parc.find(v=>v.id===d.vedit));
 else if(d.pub)publish(d.pub,true);
 else if(d.unpub)publish(d.unpub,false);
 else if(d.sortie)sortieForm(d.sortie);
 else if("import" in d)importAnnonces();
 else if("csv" in d)csv();
 else if("print" in d)window.print();
 else if("cancel" in d)$("dlg").close();
 else if("cancel2" in d)$("dlg2").close();
 else if(d.rph!==undefined){ph.splice(+d.rph,1);$("phs").innerHTML=phHtml()}
 else if("cnew" in d)cliForm(null);
 else if(d.cedit)cliForm(cl(d.cedit));
 else if(d.cdel){if(pend==="c:"+d.cdel){pend=null;act(sb.from("clients").delete().eq("id",d.cdel))}else{pend="c:"+d.cdel;render()}}
 else if(d.dcli){const x=S.dem.find(z=>z.id===d.dcli);const w=String(x.nom||"").trim().split(/\s+/);cliForm(null,null,{prenom:w.length>1?w[0]:"",nom:w.length>1?w.slice(1).join(" "):x.nom,telephone:x.telephone,email:x.email,ville:x.ville})}
 else if(d.dveh){const x=S.dem.find(z=>z.id===d.dveh),w=String(x.marque_modele||"").trim().split(/\s+/);vehForm(null,{marque:w[0]||"",modele:w.slice(1).join(" "),annee:x.annee,km:x.km,energie:x.energie,boite:x.boite,immatriculation:x.immatriculation,type_entree:x.souhait==="depot"?"depot_vente":"achat",note:x.etat})}
 else if(d.ddel){if(pend==="d:"+d.ddel){pend=null;act(sb.from("demandes").delete().eq("id",d.ddel))}else{pend="d:"+d.ddel;render()}}
});
document.addEventListener("change",e=>{
 const d=e.target.dataset,v=e.target.value;
 if(d.vst)setStatut(d.vst,v);
 if(d.rst)act(sb.from("demandes").update({statut:v}).eq("id",d.rst));
 if(d.note)act(sb.from("demandes").update({note:v}).eq("id",d.note));
 if(d.rap&&e.target.checked)act(sb.from("demandes").update({rappele:true}).eq("id",d.rap));
});
document.addEventListener("input",e=>{if(e.target.id==="qv"){qv=e.target.value;const p=e.target.selectionStart;$("mn").innerHTML=page();const n=$("qv");n.focus();n.setSelectionRange(p,p)}});
init();
</script>
